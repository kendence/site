<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kendence F.C.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a202c; color: white; }
        #login-screen { background-color: rgba(26, 32, 44, 0.95); z-index: 50; }
        .login-box { background-color: #2d3748; padding: 2.5rem; border-radius: 0.5rem; }
        .login-input { background-color: #4a5568; border: 1px solid #718096; color: white; border-radius: 0.375rem; padding: 0.75rem 1rem; }
        .login-btn { background-color: #4299e1; color: white; padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: bold; }
        #admin-panel { display: none; }
        .form-section { background-color: #2d3748; padding: 2rem; border-radius: 0.5rem; margin-bottom: 2rem; }
        .form-input { background-color: #4a5568; border: 1px solid #718096; color: white; border-radius: 0.375rem; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: bold; cursor: pointer; }
        .btn-primary { background-color: #4299e1; color: white; }
        .btn-secondary { background-color: #718096; color: white; }
        .btn-danger { background-color: #e53e3e; color: white; }
        .url-input-container { display: flex; align-items: center; border: 1px solid #718096; border-radius: 0.375rem; background-color: #4a5568; }
        .url-base { background-color: #2d3748; padding: 0.5rem; white-space: nowrap; border-right: 1px solid #718096; font-size: 0.8rem; }
        .url-final-input { border: none; outline: none; padding: 0.5rem; width: 100%; background-color: transparent; color: white; }
    </style>
</head>
<body class="p-8 font-sans">

    <div id="login-screen" class="fixed inset-0 flex items-center justify-center">
        <div class="login-box w-full max-w-sm">
            <img src="https://i.postimg.cc/0j9pxz9j/kendence-logo.png" alt="Brasão Kendence F.C." class="w-32 h-32 mx-auto mb-4 object-contain">
            <h1 class="text-3xl font-bold text-center mb-6">Admin Login</h1>
            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">E-mail</label>
                    <input type="email" id="email" class="login-input w-full" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-1">Senha</label>
                    <input type="password" id="password" class="login-input w-full" required>
                </div>
                <button type="submit" class="login-btn w-full">Entrar</button>
            </form>
        </div>
    </div>
    
    <div id="admin-panel"> 
        <div class="fixed top-4 right-4 z-50 flex items-center space-x-4">
            <button onclick="logout()" class="btn btn-danger py-1 px-3 text-sm">Sair</button>
        </div>

        <h1 class="text-4xl font-bold text-center mb-8">Painel Admin - Kendence F.C.</h1>

        <div class="mb-8">
            <label class="block mb-2 text-lg font-medium">Gerenciar Seção:</label>
            <select id="section-select" class="form-input w-full p-3" onchange="showForm(this.value)">
                <option value="upcomingGames">Próximos Jogos</option>
                <option value="sponsors">Patrocinadores</option>
            </select>
        </div>

        <div id="forms-container">
            <div id="form-sponsors" class="form-section hidden">
                <h2 class="text-2xl font-bold mb-4">Gerenciar Patrocinadores</h2>
                <form id="sponsors-form" class="grid grid-cols-1 gap-4">
                    <input type="hidden" id="sponsors-id">
                    
                    <input type="text" id="sponsors-name" placeholder="Nome do Patrocinador" class="form-input p-2" required>
                    
                    <div>
                        <label class="block text-sm font-medium mb-1">Final da URL da Imagem</label>
                        <div class="url-input-container">
                            <span class="url-base" id="sponsors-baseUrl">https://i.postimg.cc/</span>
                            <input type="text" id="sponsors-image-final" class="url-final-input" placeholder="ex: 0j9pxz9j/foto.png" required>
                        </div>
                    </div>
                    
                    <input type="text" id="sponsors-phone" placeholder="Telefone" class="form-input p-2">
                    <input type="text" id="sponsors-address" placeholder="Endereço" class="form-input p-2">
                    <input type="url" id="sponsors-instagram" placeholder="Link Instagram" class="form-input p-2" required>
                    
                    <div class="flex space-x-2">
                        <button type="submit" class="btn btn-primary" id="btn-save-sponsors">Adicionar / Salvar</button>
                        <button type="button" onclick="clearForm('sponsors')" class="btn btn-secondary">Limpar</button>
                    </div>
                </form>
            </div>
        </div>

        <h2 class="text-2xl font-bold mt-8 mb-4">Dados Atuais</h2>
        <div id="data-display" class="mb-8 bg-gray-800 p-4 rounded border border-gray-700"></div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz1fgGgpB7F05-watfO69vi6Mpzgw1uMs",
            authDomain: "kendencefc-66b8b.firebaseapp.com",
            projectId: "kendencefc-66b8b",
            storageBucket: "kendencefc-66b8b.firebasestorage.app",
            messagingSenderId: "405923587103",
            appId: "1:405923587103:web:b74f3a37deff2f07bc212a"
        };
        
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app); 
        const auth = getAuth(app); 

        const sections = {
            upcomingGames: { dbRef: 'upcomingGames', formId: 'upcomingGames-form', titleField: 'teams' },
            sponsors: { dbRef: 'sponsors', formId: 'sponsors-form', titleField: 'name' }
        };

        let currentSection = 'upcomingGames';

        // LOGIN
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('admin-panel').style.display = 'block';
                    initializeAdminPanel();
                }).catch(err => alert("Erro ao entrar: " + err.message));
        });

        window.logout = () => signOut(auth).then(() => location.reload());

        function initializeAdminPanel() {
            window.showForm = (s) => {
                currentSection = s;
                document.querySelectorAll('.form-section').forEach(f => f.classList.add('hidden'));
                document.getElementById(`form-${s}`).classList.remove('hidden');
                loadData(s);
            };

            window.clearForm = (s) => {
                const form = document.getElementById(sections[s].formId);
                form.reset();
                document.getElementById(`${s}-id`).value = '';
                form.querySelector('button[type="submit"]').textContent = 'Adicionar / Salvar';
            };

            window.loadData = (s) => {
                const display = document.getElementById('data-display');
                onValue(ref(database, sections[s].dbRef), (snapshot) => {
                    display.innerHTML = '';
                    if (snapshot.exists()) {
                        Object.entries(snapshot.val()).forEach(([key, val]) => {
                            const div = document.createElement('div');
                            div.className = 'bg-gray-700 p-3 rounded flex justify-between items-center mb-2';
                            div.innerHTML = `<span>${val[sections[s].titleField]}</span>
                                <div>
                                    <button onclick="editItem('${key}')" class="btn btn-secondary py-1 px-2 text-sm mr-2">Editar</button>
                                    <button onclick="deleteItem('${key}')" class="btn btn-danger py-1 px-2 text-sm">Excluir</button>
                                </div>`;
                            display.appendChild(div);
                        });
                    } else { display.innerHTML = 'Nenhum registro encontrado.'; }
                });
            };

            // EDITAR (Corrigido para preencher os novos campos)
            window.editItem = async (key) => {
                const s = currentSection;
                const snap = await get(ref(database, `${sections[s].dbRef}/${key}`));
                if (snap.exists()) {
                    const data = snap.val();
                    const form = document.getElementById(sections[s].formId);
                    document.getElementById(`${s}-id`).value = key;
                    form.querySelector('button[type="submit"]').textContent = 'Salvar Edição';

                    // Mapeia campos simples
                    Object.keys(data).forEach(field => {
                        const input = document.getElementById(`${s}-${field}`);
                        if (input && field !== 'image') input.value = data[field];
                    });

                    // Trata URL da Imagem para o prefixo
                    if (data.image) {
                        const baseUrl = document.getElementById(`${s}-baseUrl`).innerText;
                        const finalUrlInput = document.getElementById(`${s}-image-final`);
                        finalUrlInput.value = data.image.replace(baseUrl, '');
                    }
                    window.scrollTo(0, 0);
                }
            };

            // SALVAR
            document.querySelectorAll('form').forEach(form => {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const s = currentSection;
                    const id = document.getElementById(`${s}-id`).value;
                    const formData = {};
                    
                    // Captura campos do form
                    const inputs = form.querySelectorAll('input:not([type="hidden"]), select, textarea');
                    inputs.forEach(i => {
                        const key = i.id.replace(`${s}-`, '').replace('-final', '');
                        formData[key] = i.value;
                    });

                    // Monta URL completa da imagem
                    if (formData.image) {
                        const baseUrl = document.getElementById(`${s}-baseUrl`).innerText;
                        formData.image = baseUrl + formData.image;
                    }

                    const dbRef = id ? ref(database, `${sections[s].dbRef}/${id}`) : push(ref(database, sections[s].dbRef));
                    set(dbRef, formData).then(() => {
                        alert("Sucesso!");
                        clearForm(s);
                    });
                });
            });

            window.deleteItem = (key) => {
                if (confirm("Excluir?")) remove(ref(database, `${sections[currentSection].dbRef}/${key}`));
            };

            showForm(currentSection);
        }
    </script>
</body>
</html>
