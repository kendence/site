<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kendence F.C.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="icon" href="favicon.png" type="https://i.postimg.cc/Twzwm9Bh/favicon.png">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'kendence-red': '#D31F37',
                        'kendence-blue': '#1F3A79',
                        'kendence-dark-blue': '#162B58',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f0f2f5; color: #1a202c; font-family: 'Inter', sans-serif; }
        #login-screen { background-color: #162B58; }
        .login-box { background-color: white; padding: 2.5rem; border-radius: 0.75rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .login-input { background-color: #f8fafc; border: 1px solid #e2e8f0; color: #1a202c; border-radius: 0.5rem; padding: 0.75rem 1rem; width: 100%; margin-bottom: 1rem; }
        .admin-header { background-color: #D31F37; color: white; padding: 1rem 0; margin-bottom: 2rem; }
        .form-section { background-color: white; padding: 2rem; border-radius: 0.5rem; border-top: 4px solid #D31F37; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-input { background-color: #ffffff; border: 1px solid #cbd5e1; color: #1a202c; border-radius: 0.375rem; padding: 0.6rem; width: 100%; margin-bottom: 1rem; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; transition: all 0.2s; cursor: pointer; }
        .btn-primary { background-color: #1F3A79; color: white; }
        .btn-primary:hover { background-color: #162B58; }
        .btn-danger { background-color: #D31F37; color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        #data-display { background-color: white; border-radius: 0.5rem; border: 1px solid #e2e8f0; margin-top: 1rem; }
        .url-input-container { display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 0.375rem; background-color: #f8fafc; overflow: hidden; margin-bottom: 1rem; }
        .url-base { background-color: #e2e8f0; padding: 0.6rem; font-size: 0.75rem; color: #475569; border-right: 1px solid #cbd5e1; white-space: nowrap; }
    </style>
</head>
<body>

    <div id="login-screen" class="fixed inset-0 flex items-center justify-center z-50">
        <div class="login-box w-full max-w-sm">
            <img src="https://i.postimg.cc/YCqbzcpH/brasao-1.png" alt="Kendence" class="h-16 mx-auto mb-6">
            <h1 class="text-xl font-black text-center mb-6 text-kendence-dark-blue uppercase">Acesso Administrativo</h1>
            <form id="login-form">
                <input type="email" id="email" class="login-input" placeholder="E-mail" required>
                <input type="password" id="password" class="login-input" placeholder="Senha" required>
                <button type="submit" class="btn btn-primary w-full">Entrar</button>
                <p id="login-error" class="text-red-600 text-xs mt-3 text-center hidden font-bold"></p> 
            </form>
        </div>
    </div>
    
    <div id="admin-panel" class="hidden pb-20"> 
        <header class="admin-header shadow-lg">
            <div class="container mx-auto px-6 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://i.postimg.cc/YCqbzcpH/brasao-1.png" class="h-10">
                    <span class="font-black uppercase tracking-tighter">Admin - Kendence F.C.</span>
                </div>
                <button onclick="logout()" class="btn bg-white text-kendence-red">Sair</button>
            </div>
        </header>

        <div class="container mx-auto px-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="form-section mb-6">
                    <h2 class="text-sm font-black uppercase text-kendence-blue mb-4">Navegação</h2>
                    <select id="section-select" class="form-input font-bold" onchange="showForm(this.value)">
                        <option value="upcomingGames">Próximos Jogos</option>
                        <option value="recentResults">Resultados Recentes</option>
                        <option value="news">Notícias</option>
                        <option value="players">Jogadores</option>
                        <option value="sponsors">Patrocinadores</option>
                    </select>
                </div>
                
                <div class="form-section bg-kendence-dark-blue text-white border-none text-center">
                    <h2 class="text-sm font-black uppercase mb-4">Backup e Restauração</h2>
                    <button onclick="backupData()" class="btn bg-white text-kendence-dark-blue w-full mb-2">Fazer Backup</button>
                    <button onclick="triggerRestore()" class="btn btn-danger w-full">Restaurar Backup</button>
                    <input type="file" id="restore-file-input" class="hidden" accept=".json" onchange="restoreData(event)">
                </div>
            </div>

            <div class="lg:col-span-2">
                <div id="forms-container">
                    
                    <div id="form-upcomingGames" class="form-section">
    <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Gerenciar Próximos Jogos</h2>
    <form id="upcomingGames-form">
        <input type="hidden" id="upcomingGames-id">
        <!-- NOVO CAMPO ABAIXO -->
        <textarea id="upcomingGames-competition" placeholder="Nome do Campeonato (Pode pular linha)" class="form-input h-16"></textarea>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-xs font-bold text-gray-400 mb-1">Data</label><input type="date" id="upcomingGames-date-input" class="form-input" required></div>
            <div><label class="block text-xs font-bold text-gray-400 mb-1">Hora</label><input type="time" id="upcomingGames-time-input" class="form-input" required></div>
        </div>
        <input type="text" id="upcomingGames-teams" placeholder="Times (ex: Kendence vs. Time B)" class="form-input" required>
        <input type="text" id="upcomingGames-location" placeholder="Nome do Campo" class="form-input" required>
        <input type="url" id="upcomingGames-mapLink" placeholder="Link do Google Maps" class="form-input" required>
        <button type="submit" class="btn btn-primary">Adicionar / Salvar</button>
        <button type="button" onclick="clearForm('upcomingGames')" class="btn btn-secondary">Limpar</button>
    </form>
</div>

                    <div id="form-recentResults" class="form-section hidden">
    <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Gerenciar Resultados</h2>
    <form id="recentResults-form">
        <input type="hidden" id="recentResults-id">
        <!-- NOVO CAMPO ABAIXO -->
        <textarea id="recentResults-competition" placeholder="Nome do Campeonato (Pode pular linha)" class="form-input h-16"></textarea>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div><label class="block text-xs font-bold text-gray-400 mb-1">Data</label><input type="date" id="recentResults-date-input" class="form-input" required></div>
            <div><label class="block text-xs font-bold text-gray-400 mb-1">Hora</label><input type="time" id="recentResults-time-input" class="form-input" required></div>
        </div>
        <input type="text" id="recentResults-match" placeholder="Resultado (ex: Kendence 3 x 2 Time B)" class="form-input" required>
        <input type="text" id="recentResults-location" placeholder="Nome do Campo" class="form-input" required>
        <input type="url" id="recentResults-videoLink" placeholder="Link para Fotos/Vídeos" class="form-input" required>
<div class="grid grid-cols-2 gap-4 mb-2">
    <div>
        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Ocorrências Kendence</label>
        <textarea id="recentResults-occurrencesA" placeholder="Gols: Atleta X (2), Atleta Y" class="form-input text-xs h-16"></textarea>
    </div>
    <div>
        <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Ocorrências Adversário</label>
        <textarea id="recentResults-occurrencesB" placeholder="Cartão Amarelo: Jogador Z" class="form-input text-xs h-16"></textarea>
    </div>
</div>
        <button type="submit" class="btn btn-primary">Adicionar / Salvar</button>
        <button type="button" onclick="clearForm('recentResults')" class="btn btn-secondary">Limpar</button>
    </form>
</div>

                    <div id="form-news" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Gerenciar Notícias</h2>
                        <form id="news-form">
                            <input type="hidden" id="news-id">
                            <input type="date" id="news-date" class="form-input" required>
                            <input type="text" id="news-title" placeholder="Título da Notícia" class="form-input" required>
                            <div class="url-input-container">
                                <span class="url-base" id="news-baseUrl">https://lh3.googleusercontent.com/d/</span>
                                <input type="text" id="news-image-final" class="p-2 w-full outline-none" placeholder="cole o final da URL aqui" required>
                            </div>
                            <textarea id="news-text" class="form-input h-32" placeholder="Texto da Notícia" required></textarea>
                            <button type="submit" class="btn btn-primary">Adicionar / Salvar</button>
                            <button type="button" onclick="clearForm('news')" class="btn btn-secondary">Limpar</button>
                        </form>
                    </div>

                    <div id="form-players" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Gerenciar Jogadores e Comissão</h2>
                        <form id="players-form">
                            <input type="hidden" id="players-id">
                            <input type="text" id="players-name" placeholder="Nome do Jogador" class="form-input" required>
                            <select id="players-role" class="form-input" required>
                                <option value="">Selecione a Função</option>
                                <option value="Técnico">Técnico</option>
                                <option value="Auxiliar técnico">Auxiliar técnico</option>
                                <option value="Preparador físico">Preparador físico</option>
                                <option value="Fisioterapeuta">Fisioterapeuta</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Analista de desempenho">Analista de desempenho</option>
                                <option value="Fotografo">Fotografo</option>
                                <option value="Diretor">Diretor</option>
                                <option value="Preparador de goleiros">Preparador de goleiros</option>
                                <option value="Goleiro">Goleiro</option>
                                <option value="Zagueiro e Volante">Zagueiro e Volante</option>
                                <option value="Lateral">Lateral</option>
                                <option value="Meio">Meio-Campo</option>
                                <option value="Atacante">Atacante</option>
                                <option value="Centroavante">Centroavante</option>
                                <option value="Gandula">Gandula</option>
                            </select>
                            <input type="url" id="players-image" placeholder="Link da Foto (URL)" class="form-input">
                            <input type="url" id="players-instagram" placeholder="Link do Instagram" class="form-input">
                            <textarea id="players-description" class="form-input h-24" placeholder="Descrição (Apelido, Camisa, Idade, etc.)"></textarea>
                            <button type="submit" class="btn btn-primary">Adicionar / Salvar</button>
                            <button type="button" onclick="clearForm('players')" class="btn btn-secondary">Limpar</button>
                        </form>
                    </div>

                    <div id="form-sponsors" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Gerenciar Patrocinadores</h2>
                        <form id="sponsors-form">
                            <input type="hidden" id="sponsors-id">
                            <input type="text" id="sponsors-name" placeholder="Nome do Patrocinador" class="form-input" required>
                            <div class="url-input-container">
                                <span class="url-base" id="sponsors-baseUrl">https://lh3.googleusercontent.com/d/</span>
                                <input type="text" id="sponsors-image-final" class="p-2 w-full outline-none" placeholder="cole o final da URL aqui" required>
                            </div>
                            <input type="text" id="sponsors-phone" placeholder="Telefone (ex: 43 99999-9999)" class="form-input">
                            <input type="text" id="sponsors-address" placeholder="Endereço" class="form-input">
                            <input type="url" id="sponsors-instagram" placeholder="Link do Patrocinador" class="form-input" required>
                            <button type="submit" class="btn btn-primary">Adicionar / Salvar</button>
                            <button type="button" onclick="clearForm('sponsors')" class="btn btn-secondary">Limpar</button>
                        </form>
                    </div>
                </div>

                <h2 class="text-xl font-black text-kendence-dark-blue uppercase mt-8 mb-4">Dados Atuais</h2>
                <div id="data-display" class="p-4"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz1fgGgpB7F05-watfO69vi6Mpzgw1uMs",
            authDomain: "kendencefc-66b8b.firebaseapp.com",
            projectId: "kendencefc-66b8b",
            storageBucket: "kendencefc-66b8b.firebasestorage.app",
            messagingSenderId: "405923587103",
            appId: "1:405923587103:web:b74f3a37deff2f07bc212a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const sections = {
            upcomingGames: { dbRef: 'upcomingGames', formId: 'upcomingGames-form', titleField: 'teams' },
            recentResults: { dbRef: 'recentResults', formId: 'recentResults-form', titleField: 'match' },
            news: { dbRef: 'news', formId: 'news-form', titleField: 'title' },
            players: { dbRef: 'players', formId: 'players-form', titleField: 'name' },
            sponsors: { dbRef: 'sponsors', formId: 'sponsors-form', titleField: 'name' }
        };

        let currentSection = 'upcomingGames';

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password).catch(err => {
                const errP = document.getElementById('login-error');
                errP.textContent = "Erro: E-mail ou senha inválidos.";
                errP.classList.remove('hidden');
            });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                setupFormNames();
                loadData(currentSection);
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        });

        window.logout = () => signOut(auth);

        window.showForm = (name) => {
            currentSection = name;
            Object.keys(sections).forEach(k => document.getElementById(`form-${k}`).classList.add('hidden'));
            document.getElementById(`form-${name}`).classList.remove('hidden');
            clearForm(name);
            loadData(name);
        };

        window.clearForm = (name) => {
            const form = document.getElementById(sections[name].formId);
            form.reset();
            const idInput = form.querySelector(`[id$="-id"]`);
            if (idInput) idInput.value = '';
            const submitBtn = form.querySelector('button[type="submit"]');
            if (submitBtn) submitBtn.textContent = 'Adicionar / Salvar';
        };

        window.loadData = (name) => {
    const display = document.getElementById('data-display');
    onValue(ref(database, sections[name].dbRef), (snapshot) => {
        display.innerHTML = '';
        if (snapshot.exists()) {
            // Convertemos o objeto em array de entradas [chave, valor]
            const entries = Object.entries(snapshot.val());
            
            // Invertemos a ordem apenas para as seções solicitadas
            if (['upcomingGames', 'recentResults', 'news'].includes(name)) {
                entries.reverse();
            }

            entries.forEach(([key, val]) => {
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center p-3 border-b hover:bg-gray-50';
                item.innerHTML = `<span class="font-medium text-sm">${val[sections[name].titleField]}</span>
                    <div>
                        <button onclick="editItem('${key}')" class="text-blue-600 mr-3 text-xs font-bold uppercase">Editar</button>
                        <button onclick="deleteItem('${key}')" class="text-red-600 text-xs font-bold uppercase">Excluir</button>
                    </div>`;
                display.appendChild(item);
            });
        } else {
            display.innerHTML = '<p class="text-gray-400 text-sm py-4">Nenhum dado encontrado.</p>';
        }
    });
};
        } else {
            display.innerHTML = '<p class="text-gray-400 text-sm py-4">Nenhum dado encontrado.</p>';
        }
    });
};
                } else {
                    display.innerHTML = '<p class="text-gray-400 text-sm py-4">Nenhum dado encontrado.</p>';
                }
            });
        };

        async function handleFormSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const id = form.querySelector(`[id$="-id"]`).value;
            const data = {};
            
            for (const el of form.elements) {
                if (el.name && el.name !== 'id') {
                    data[el.name] = el.value;
                }
            }

            if (currentSection === 'upcomingGames' || currentSection === 'recentResults') {
                if (data.date && data.time) {
                    const combined = new Date(`${data.date}T${data.time}:00`);
                    data.date = combined.getTime();
                    delete data.time;
                }
            }
            if (currentSection === 'news' && data.date) {
                data.date = new Date(`${data.date}T00:00:00`).getTime();
            }
            if ((currentSection === 'news' || currentSection === 'sponsors') && data['image-final']) {
                const base = document.getElementById(`${currentSection}-baseUrl`).innerText;
                data.image = base + data['image-final'];
                delete data['image-final'];
            }

            const path = id ? `${sections[currentSection].dbRef}/${id}` : sections[currentSection].dbRef;
            if (id) {
                await set(ref(database, path), data);
            } else {
                await push(ref(database, path), data);
            }
            clearForm(currentSection);
            alert("Sucesso!");
        }

        window.editItem = (key) => {
            const section = sections[currentSection];
            get(ref(database, `${section.dbRef}/${key}`)).then(snap => {
                if (snap.exists()) {
                    const data = snap.val();
                    const form = document.getElementById(section.formId);
                    form.querySelector(`[id$="-id"]`).value = key;
                    form.querySelector('button[type="submit"]').textContent = 'Salvar Edição';

                    for (const el of form.elements) {
                        if (el.name && data[el.name] !== undefined) el.value = data[el.name];
                    }

                    if (currentSection === 'upcomingGames' || currentSection === 'recentResults') {
                        const d = new Date(data.date);
                        form.querySelector(`[id$="-date-input"]`).value = d.toISOString().split('T')[0];
                        form.querySelector(`[id$="-time-input"]`).value = d.toTimeString().split(' ')[0].substring(0, 5);
                    }
                    if (currentSection === 'news') {
                        form.querySelector('#news-date').value = new Date(data.date).toISOString().split('T')[0];
                    }
                    if ((currentSection === 'news' || currentSection === 'sponsors') && data.image) {
                        const base = document.getElementById(`${currentSection}-baseUrl`).innerText;
                        if (data.image.startsWith(base)) form.querySelector(`[id$="-image-final"]`).value = data.image.substring(base.length);
                    }
                    window.scrollTo(0, 0);
                }
            });
        };

        window.deleteItem = (key) => { if(confirm("Excluir?")) remove(ref(database, `${sections[currentSection].dbRef}/${key}`)); };

        function setupFormNames() {
            Object.keys(sections).forEach(sec => {
                const f = document.getElementById(sections[sec].formId);
                Array.from(f.elements).forEach(el => {
                    if (el.id && !el.name && el.type !== 'hidden') {
                        let n = el.id.replace(`${sec}-`, '').replace('-input', '');
                        el.name = n;
                    }
                });
            });
        }

        Object.keys(sections).forEach(k => document.getElementById(sections[k].formId).addEventListener('submit', handleFormSubmit));

        window.backupData = async () => {
            const snap = await get(ref(database));
            const blob = new Blob([JSON.stringify(snap.val(), null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `backup_kendence_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
        };

        window.triggerRestore = () => document.getElementById('restore-file-input').click();
        window.restoreData = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (ev) => {
                if(confirm("Substituir tudo?")) {
                    await set(ref(database), JSON.parse(ev.target.result));
                    alert("Concluído!");
                    loadData(currentSection);
                }
            };
            reader.readAsText(file);
        };
    </script>
</body>
</html>
