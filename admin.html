<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kendence F.C.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="icon" href="favicon.png" type="https://i.postimg.cc/Twzwm9Bh/favicon.png">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'kendence-red': '#D31F37',
                        'kendence-blue': '#1F3A79',
                        'kendence-dark-blue': '#162B58',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f0f2f5; color: #1a202c; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        #login-screen { background-color: #162B58; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .login-box { background-color: white; padding: 2.5rem; border-radius: 0.75rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); width: 100%; max-width: 24rem; }
        .login-input { background-color: #f8fafc; border: 1px solid #e2e8f0; color: #1a202c; border-radius: 0.5rem; padding: 0.75rem 1rem; width: 100%; margin-bottom: 1rem; }
        .admin-header { background-color: #D31F37; color: white; padding: 1rem 0; }
        .form-section { background-color: white; padding: 2rem; border-radius: 0.5rem; border-top: 4px solid #D31F37; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-input { background-color: #ffffff; border: 1px solid #cbd5e1; color: #1a202c; border-radius: 0.375rem; padding: 0.6rem; width: 100%; margin-bottom: 1rem; }
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; transition: all 0.2s; cursor: pointer; border: none; }
        .btn-primary { background-color: #1F3A79; color: white; }
        .btn-primary:hover { background-color: #162B58; }
        .btn-danger { background-color: #D31F37; color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        #data-display { background-color: white; border-radius: 0.5rem; border: 1px solid #e2e8f0; margin-top: 1rem; }
        .url-input-container { display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 0.375rem; background-color: #f8fafc; overflow: hidden; margin-bottom: 1rem; }
        .url-base { background-color: #e2e8f0; padding: 0.6rem; font-size: 0.75rem; color: #475569; border-right: 1px solid #cbd5e1; white-space: nowrap; }
        main { flex: 1; }
        footer { background-color: #162B58; color: #9ca3af; padding: 1.5rem 0; text-align: center; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <img src="https://i.postimg.cc/YCqbzcpH/brasao-1.png" alt="Kendence" class="h-16 mx-auto mb-6">
            <h1 class="text-xl font-black text-center mb-6 text-kendence-dark-blue uppercase tracking-tight">Admin Login</h1>
            <form id="login-form">
                <input type="email" id="email" class="login-input" placeholder="E-mail" required>
                <input type="password" id="password" class="login-input" placeholder="Senha" required>
                <button type="submit" class="btn btn-primary w-full">Entrar</button>
                <p id="login-error" class="text-red-600 text-xs mt-3 text-center hidden font-bold"></p> 
            </form>
        </div>
    </div>
    
    <div id="admin-panel" class="hidden"> 
        <header class="admin-header shadow-lg">
            <div class="container mx-auto px-6 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://i.postimg.cc/YCqbzcpH/brasao-1.png" class="h-10">
                    <span class="font-black uppercase tracking-tighter">Kendence F.C. Admin</span>
                </div>
                <button onclick="logout()" class="btn bg-white text-kendence-red hover:bg-gray-100">Sair</button>
            </div>
        </header>

        <main class="container mx-auto px-6 py-10 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="form-section">
                    <h2 class="text-sm font-black uppercase text-kendence-blue mb-4">Gerenciar</h2>
                    <select id="section-select" class="form-input font-bold">
                        <option value="upcomingGames">Próximos Jogos</option>
                        <option value="recentResults">Resultados Recentes</option>
                        <option value="news">Notícias</option>
                        <option value="players">Jogadores</option>
                        <option value="sponsors">Patrocinadores</option>
                    </select>
                </div>
                
                <div class="form-section bg-kendence-dark-blue text-white border-none text-center">
                    <h2 class="text-sm font-black uppercase mb-4">Sistema</h2>
                    <button onclick="backupData()" class="btn bg-white text-kendence-dark-blue w-full mb-2">Backup</button>
                    <button onclick="triggerRestore()" class="btn btn-danger w-full">Restaurar</button>
                    <input type="file" id="restore-file-input" class="hidden" accept=".json">
                </div>
            </div>

            <div class="lg:col-span-2">
                <div id="forms-container">
                    <div id="form-upcomingGames" class="form-section">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Próximos Jogos</h2>
                        <form id="upcomingGames-form">
                            <input type="hidden" id="upcomingGames-id">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="date" id="upcomingGames-date-input" class="form-input" required>
                                <input type="time" id="upcomingGames-time-input" class="form-input" required>
                            </div>
                            <input type="text" id="upcomingGames-teams" placeholder="Times (ex: Kendence vs. Time B)" class="form-input" required>
                            <input type="text" id="upcomingGames-location" placeholder="Local" class="form-input" required>
                            <input type="url" id="upcomingGames-mapLink" placeholder="Link Google Maps" class="form-input" required>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <button type="button" onclick="clearForm('upcomingGames')" class="btn btn-secondary ml-2">Limpar</button>
                        </form>
                    </div>

                    <div id="form-recentResults" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Resultados</h2>
                        <form id="recentResults-form">
                            <input type="hidden" id="recentResults-id">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="date" id="recentResults-date-input" class="form-input" required>
                                <input type="time" id="recentResults-time-input" class="form-input" required>
                            </div>
                            <input type="text" id="recentResults-match" placeholder="Resultado (ex: Kendence 3 x 2 Time B)" class="form-input" required>
                            <input type="text" id="recentResults-location" placeholder="Local" class="form-input" required>
                            <input type="url" id="recentResults-videoLink" placeholder="Link Mídia" class="form-input" required>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <button type="button" onclick="clearForm('recentResults')" class="btn btn-secondary ml-2">Limpar</button>
                        </form>
                    </div>

                    <div id="form-news" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Notícias</h2>
                        <form id="news-form">
                            <input type="hidden" id="news-id">
                            <input type="date" id="news-date" class="form-input" required>
                            <input type="text" id="news-title" placeholder="Título" class="form-input" required>
                            <div class="url-input-container">
                                <span class="url-base" id="news-baseUrl">https://lh3.googleusercontent.com/d/</span>
                                <input type="text" id="news-image-final" class="p-2 w-full outline-none" placeholder="ID da imagem" required>
                            </div>
                            <textarea id="news-text" class="form-input h-32" placeholder="Texto da Notícia" required></textarea>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <button type="button" onclick="clearForm('news')" class="btn btn-secondary ml-2">Limpar</button>
                        </form>
                    </div>

                    <div id="form-players" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Jogadores</h2>
                        <form id="players-form">
                            <input type="hidden" id="players-id">
                            <input type="text" id="players-name" placeholder="Nome" class="form-input" required>
                            <select id="players-role" class="form-input" required>
                                <option value="">Selecione a Função</option>
                                <option value="Técnico">Técnico</option>
                                <option value="Auxiliar técnico">Auxiliar técnico</option>
                                <option value="Preparador físico">Preparador físico</option>
                                <option value="Fisioterapeuta">Fisioterapeuta</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Analista de desempenho">Analista de desempenho</option>
                                <option value="Fotografo">Fotografo</option>
                                <option value="Diretor">Diretor</option>
                                <option value="Preparador de goleiros">Preparador de goleiros</option>
                                <option value="Goleiro">Goleiro</option>
                                <option value="Zagueiro e Volante">Zagueiro e Volante</option>
                                <option value="Lateral">Lateral</option>
                                <option value="Meio">Meio-Campo</option>
                                <option value="Atacante">Atacante</option>
                                <option value="Centroavante">Centroavante</option>
                                <option value="Gandula">Gandula</option>
                            </select>
                            <input type="url" id="players-image" placeholder="URL Foto" class="form-input">
                            <input type="url" id="players-instagram" placeholder="Link Instagram" class="form-input">
                            <textarea id="players-description" class="form-input h-24" placeholder="Descrição (Camisa, Peso, etc.)"></textarea>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <button type="button" onclick="clearForm('players')" class="btn btn-secondary ml-2">Limpar</button>
                        </form>
                    </div>

                    <div id="form-sponsors" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Patrocinadores</h2>
                        <form id="sponsors-form">
                            <input type="hidden" id="sponsors-id">
                            <input type="text" id="sponsors-name" placeholder="Empresa" class="form-input" required>
                            <div class="url-input-container">
                                <span class="url-base" id="sponsors-baseUrl">https://lh3.googleusercontent.com/d/</span>
                                <input type="text" id="sponsors-image-final" class="p-2 w-full outline-none" placeholder="ID imagem" required>
                            </div>
                            <input type="text" id="sponsors-phone" placeholder="Telefone" class="form-input">
                            <input type="text" id="sponsors-address" placeholder="Endereço" class="form-input">
                            <input type="url" id="sponsors-instagram" placeholder="Link Site" class="form-input" required>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                            <button type="button" onclick="clearForm('sponsors')" class="btn btn-secondary ml-2">Limpar</button>
                        </form>
                    </div>
                </div>

                <div id="data-display" class="p-4 mt-6"></div>
            </div>
        </main>

        <footer>
            <div class="container mx-auto">
                © 2025 Kendence F.C. Todos os direitos reservados. Design por An.Yoshi.
            </div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz1fgGgpB7F05-watfO69vi6Mpzgw1uMs",
            authDomain: "kendencefc-66b8b.firebaseapp.com",
            projectId: "kendencefc-66b8b",
            storageBucket: "kendencefc-66b8b.firebasestorage.app",
            messagingSenderId: "405923587103",
            appId: "1:405923587103:web:b74f3a37deff2f07bc212a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const sections = {
            upcomingGames: { dbRef: 'upcomingGames', formId: 'upcomingGames-form', titleField: 'teams' },
            recentResults: { dbRef: 'recentResults', formId: 'recentResults-form', titleField: 'match' },
            news: { dbRef: 'news', formId: 'news-form', titleField: 'title' },
            players: { dbRef: 'players', formId: 'players-form', titleField: 'name' },
            sponsors: { dbRef: 'sponsors', formId: 'sponsors-form', titleField: 'name' }
        };

        let currentSection = 'upcomingGames';

        // LOGIN LÓGICA
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password)
            .then(() => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            })
            .catch(() => {
                document.getElementById('login-error').textContent = "Dados incorretos.";
                document.getElementById('login-error').classList.remove('hidden');
            });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                setupFormNames();
                loadData(currentSection);
            }
        });

        window.logout = () => signOut(auth).then(() => location.reload());

        // NAVEGAÇÃO
        document.getElementById('section-select').addEventListener('change', (e) => {
            currentSection = e.target.value;
            document.querySelectorAll('.form-section').forEach(f => f.classList.add('hidden'));
            document.getElementById(`form-${currentSection}`).classList.remove('hidden');
            loadData(currentSection);
        });

        window.clearForm = (name) => {
            const form = document.getElementById(sections[name].formId);
            form.reset();
            form.querySelector(`[id$="-id"]`).value = '';
        };

        // DADOS
        window.loadData = (name) => {
            const display = document.getElementById('data-display');
            onValue(ref(database, sections[name].dbRef), (snap) => {
                display.innerHTML = '';
                if (snap.exists()) {
                    Object.entries(snap.val()).forEach(([key, val]) => {
                        const row = document.createElement('div');
                        row.className = 'flex justify-between items-center p-2 border-b';
                        row.innerHTML = `<span class="text-sm font-bold text-kendence-dark-blue">${val[sections[name].titleField]}</span>
                            <div>
                                <button onclick="editItem('${key}')" class="text-blue-600 mr-4 font-bold text-xs uppercase">Editar</button>
                                <button onclick="deleteItem('${key}')" class="text-red-600 font-bold text-xs uppercase">Excluir</button>
                            </div>`;
                        display.appendChild(row);
                    });
                }
            });
        };

        async function handleFormSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const id = form.querySelector(`[id$="-id"]`).value;
            const data = {};
            for (const el of form.elements) { if (el.name && el.name !== 'id') data[el.name] = el.value; }

            if (currentSection === 'upcomingGames' || currentSection === 'recentResults') {
                if (data.date && data.time) {
                    data.date = new Date(`${data.date}T${data.time}:00`).getTime();
                    delete data.time;
                }
            } else if (currentSection === 'news' && data.date) {
                data.date = new Date(`${data.date}T00:00:00`).getTime();
            }

            if ((currentSection === 'news' || currentSection === 'sponsors') && data['image-final']) {
                data.image = document.getElementById(`${currentSection}-baseUrl`).innerText + data['image-final'];
                delete data['image-final'];
            }

            const path = id ? `${sections[currentSection].dbRef}/${id}` : sections[currentSection].dbRef;
            id ? await set(ref(database, path), data) : await push(ref(database, path), data);
            clearForm(currentSection);
            alert("Sucesso!");
        }

        window.editItem = (key) => {
            get(ref(database, `${sections[currentSection].dbRef}/${key}`)).then(snap => {
                const data = snap.val();
                const form = document.getElementById(sections[currentSection].formId);
                form.querySelector(`[id$="-id"]`).value = key;
                for (const el of form.elements) { if (el.name && data[el.name]) el.value = data[el.name]; }
                window.scrollTo(0, 0);
            });
        };

        window.deleteItem = (key) => { if(confirm("Excluir?")) remove(ref(database, `${sections[currentSection].dbRef}/${key}`)); };

        function setupFormNames() {
            Object.keys(sections).forEach(sec => {
                const f = document.getElementById(sections[sec].formId);
                Array.from(f.elements).forEach(el => { if (el.id) el.name = el.id.replace(`${sec}-`, '').replace('-input', ''); });
            });
        }

        Object.keys(sections).forEach(k => document.getElementById(sections[k].formId).addEventListener('submit', handleFormSubmit));

        window.backupData = async () => {
            const snap = await get(ref(database));
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(snap.val())], {type: 'application/json'}));
            a.download = `backup_kendence.json`;
            a.click();
        };

        window.triggerRestore = () => document.getElementById('restore-file-input').click();
        document.getElementById('restore-file-input').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = async (ev) => { await set(ref(database), JSON.parse(ev.target.result)); alert("Restaurado!"); };
            reader.readAsText(e.target.files[0]);
        });
    </script>
</body>
</html>
