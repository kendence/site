<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Kendence F.C.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="icon" href="favicon.png" type="https://i.postimg.cc/Twzwm9Bh/favicon.png">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        'kendence-red': '#D31F37',
                        'kendence-blue': '#1F3A79',
                        'kendence-dark-blue': '#162B58',
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f0f2f5; color: #1a202c; font-family: 'Inter', sans-serif; }
        
        /* Login Layout */
        #login-screen { background-color: #162B58; }
        .login-box { background-color: white; padding: 2.5rem; border-radius: 0.75rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        .login-input { background-color: #f8fafc; border: 1px solid #e2e8f0; color: #1a202c; border-radius: 0.5rem; padding: 0.75rem 1rem; width: 100%; margin-bottom: 1rem; }
        
        /* Painel Layout */
        .admin-header { background-color: #D31F37; color: white; padding: 1rem 0; margin-bottom: 2rem; }
        .form-section { background-color: white; padding: 2rem; border-radius: 0.5rem; border-top: 4px solid #D31F37; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-input { background-color: #ffffff; border: 1px solid #cbd5e1; color: #1a202c; border-radius: 0.375rem; padding: 0.6rem; width: 100%; margin-bottom: 1rem; }
        
        .btn { padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; transition: all 0.2s; cursor: pointer; }
        .btn-primary { background-color: #1F3A79; color: white; }
        .btn-primary:hover { background-color: #162B58; }
        .btn-danger { background-color: #D31F37; color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        
        #data-display { background-color: white; border-radius: 0.5rem; border: 1px solid #e2e8f0; margin-top: 1rem; }
        .url-input-container { display: flex; align-items: center; border: 1px solid #cbd5e1; border-radius: 0.375rem; background-color: #f8fafc; overflow: hidden; margin-bottom: 1rem; }
        .url-base { background-color: #e2e8f0; padding: 0.6rem; font-size: 0.75rem; color: #475569; border-right: 1px solid #cbd5e1; white-space: nowrap; }
    </style>
</head>
<body>

    <div id="login-screen" class="fixed inset-0 flex items-center justify-center z-50">
        <div class="login-box w-full max-w-sm">
            <img src="https://i.postimg.cc/YCqbzcpH/brasao-1.png" alt="Kendence" class="h-16 mx-auto mb-6">
            <h1 class="text-xl font-black text-center mb-6 text-kendence-dark-blue uppercase">Acesso Administrativo</h1>
            <form id="login-form">
                <input type="email" id="email" class="login-input" placeholder="E-mail" required>
                <input type="password" id="password" class="login-input" placeholder="Senha" required>
                <button type="submit" class="btn btn-primary w-full">Entrar</button>
                <p id="login-error" class="text-red-600 text-xs mt-3 text-center hidden font-bold"></p> 
            </form>
        </div>
    </div>
    
    <div id="admin-panel" class="hidden pb-20"> 
        <header class="admin-header shadow-lg">
            <div class="container mx-auto px-6 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <img src="https://i.postimg.cc/YCqbzcpH/brasao-1.png" class="h-10">
                    <span class="font-black uppercase tracking-tighter">Kendence F.C. Admin</span>
                </div>
                <button onclick="logout()" class="btn bg-white text-kendence-red">Sair</button>
            </div>
        </header>

        <div class="container mx-auto px-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="form-section mb-6">
                    <h2 class="text-sm font-black uppercase text-kendence-blue mb-4">Navegação</h2>
                    <select id="section-select" class="form-input font-bold" onchange="showForm(this.value)">
                        <option value="upcomingGames">Próximos Jogos</option>
                        <option value="recentResults">Resultados Recentes</option>
                        <option value="news">Notícias</option>
                        <option value="players">Jogadores</option>
                        <option value="sponsors">Patrocinadores</option>
                    </select>
                </div>
                
                <div class="form-section bg-kendence-dark-blue text-white border-none">
                    <h2 class="text-sm font-black uppercase mb-4">Sistema de Backup</h2>
                    <button onclick="backupData()" class="btn bg-white text-kendence-dark-blue w-full mb-2">Exportar Dados</button>
                    <button onclick="triggerRestore()" class="btn btn-danger w-full">Importar Dados</button>
                    <input type="file" id="restore-file-input" class="hidden" accept=".json" onchange="restoreData(event)">
                </div>
            </div>

            <div class="lg:col-span-2">
                <div id="forms-container">
                    <div id="form-upcomingGames" class="form-section">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Cadastrar Próximo Jogo</h2>
                        <form id="upcomingGames-form">
                            <input type="hidden" id="upcomingGames-id">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="date" id="upcomingGames-date-input" class="form-input" required>
                                <input type="time" id="upcomingGames-time-input" class="form-input" required>
                            </div>
                            <input type="text" id="upcomingGames-teams" placeholder="Time A vs Time B" class="form-input" required>
                            <input type="text" id="upcomingGames-location" placeholder="Local" class="form-input" required>
                            <input type="url" id="upcomingGames-mapLink" placeholder="Link Google Maps" class="form-input" required>
                            <button type="submit" class="btn btn-primary">Salvar Jogo</button>
                        </form>
                    </div>

                    <div id="form-recentResults" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Cadastrar Resultado</h2>
                        <form id="recentResults-form">
                            <input type="hidden" id="recentResults-id">
                            <div class="grid grid-cols-2 gap-4">
                                <input type="date" id="recentResults-date-input" class="form-input" required>
                                <input type="time" id="recentResults-time-input" class="form-input" required>
                            </div>
                            <input type="text" id="recentResults-match" placeholder="Placar (ex: Kendence 2 x 0 Time)" class="form-input" required>
                            <input type="text" id="recentResults-location" placeholder="Local" class="form-input" required>
                            <input type="url" id="recentResults-videoLink" placeholder="Link Vídeo/Fotos" class="form-input" required>
                            <button type="submit" class="btn btn-primary">Salvar Resultado</button>
                        </form>
                    </div>

                    <div id="form-news" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Nova Notícia</h2>
                        <form id="news-form">
                            <input type="hidden" id="news-id">
                            <input type="date" id="news-date" class="form-input" required>
                            <input type="text" id="news-title" placeholder="Título" class="form-input" required>
                            <div class="url-input-container">
                                <span class="url-base">.../picture/0/</span>
                                <input type="text" id="news-image-final" class="p-2 w-full outline-none" placeholder="ID da imagem" required>
                            </div>
                            <textarea id="news-text" class="form-input h-32" placeholder="Texto da notícia" required></textarea>
                            <button type="submit" class="btn btn-primary">Publicar</button>
                        </form>
                    </div>

                    <div id="form-players" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Cadastrar Atleta</h2>
                        <form id="players-form">
                            <input type="hidden" id="players-id">
                            <input type="text" id="players-name" placeholder="Nome" class="form-input" required>
                            <input type="text" id="players-role" placeholder="Posição" class="form-input" required>
                            <input type="url" id="players-image" placeholder="URL da Foto" class="form-input">
                            <input type="url" id="players-instagram" placeholder="Link Instagram" class="form-input">
                            <textarea id="players-description" class="form-input h-24" placeholder="Descrição/Histórico"></textarea>
                            <button type="submit" class="btn btn-primary">Salvar Atleta</button>
                        </form>
                    </div>

                    <div id="form-sponsors" class="form-section hidden">
                        <h2 class="text-lg font-black uppercase text-kendence-dark-blue mb-4">Novo Patrocinador</h2>
                        <form id="sponsors-form">
                            <input type="hidden" id="sponsors-id">
                            <input type="text" id="sponsors-name" placeholder="Nome da Empresa" class="form-input" required>
                            <div class="url-input-container">
                                <span class="url-base">.../picture/0/</span>
                                <input type="text" id="sponsors-image-final" class="p-2 w-full outline-none" required>
                            </div>
                            <input type="text" id="sponsors-phone" placeholder="Telefone" class="form-input">
                            <input type="url" id="sponsors-instagram" placeholder="Link Site/Insta" class="form-input" required>
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </form>
                    </div>
                </div>

                <div id="data-display" class="p-4">
                    </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove, get } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAz1fgGgpB7F05-watfO69vi6Mpzgw1uMs",
            authDomain: "kendencefc-66b8b.firebaseapp.com",
            projectId: "kendencefc-66b8b",
            storageBucket: "kendencefc-66b8b.firebasestorage.app",
            messagingSenderId: "405923587103",
            appId: "1:405923587103:web:b74f3a37deff2f07bc212a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const sections = {
            upcomingGames: { dbRef: 'upcomingGames', formId: 'upcomingGames-form', titleField: 'teams' },
            recentResults: { dbRef: 'recentResults', formId: 'recentResults-form', titleField: 'match' },
            news: { dbRef: 'news', formId: 'news-form', titleField: 'title' },
            players: { dbRef: 'players', formId: 'players-form', titleField: 'name' },
            sponsors: { dbRef: 'sponsors', formId: 'sponsors-form', titleField: 'name' }
        };

        let currentSection = 'upcomingGames';

        // LÓGICA DE LOGIN ORIGINAL
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, password).catch(err => {
                const errP = document.getElementById('login-error');
                errP.textContent = "Erro de acesso.";
                errP.classList.remove('hidden');
            });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadData(currentSection);
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        });

        window.logout = () => signOut(auth);

        // FUNÇÕES DE MANIPULAÇÃO DE DADOS (Cópia exata do seu original)
        window.showForm = (name) => {
            currentSection = name;
            Object.keys(sections).forEach(k => document.getElementById(`form-${k}`).classList.add('hidden'));
            document.getElementById(`form-${name}`).classList.remove('hidden');
            loadData(name);
        };

        window.loadData = (name) => {
            const display = document.getElementById('data-display');
            onValue(ref(database, sections[name].dbRef), (snapshot) => {
                display.innerHTML = '<h3 class="font-bold mb-2">Cadastrados:</h3>';
                if (snapshot.exists()) {
                    Object.entries(snapshot.val()).forEach(([key, val]) => {
                        const item = document.createElement('div');
                        item.className = 'flex justify-between p-2 border-b';
                        item.innerHTML = `<span>${val[sections[name].titleField]}</span>
                            <div>
                                <button onclick="editItem('${key}')" class="text-blue-600 mr-2">Editar</button>
                                <button onclick="deleteItem('${key}')" class="text-red-600">Excluir</button>
                            </div>`;
                        display.appendChild(item);
                    });
                }
            });
        };

        async function handleFormSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const id = form.querySelector(`[id$="-id"]`).value;
            const data = {};
            
            // Pega todos os campos do formulário de forma dinâmica
            const formData = new FormData(form);
            for (let [key, value] of formData.entries()) {
                data[key] = value;
            }

            // Lógica especial para imagens do Google User Content
            if(data['image-final']) {
                data['image'] = `https://lh3.googleusercontent.com/pw/${data['image-final']}=w500-h500-no`;
            }

            const dbPath = id ? `${sections[currentSection].dbRef}/${id}` : sections[currentSection].dbRef;
            if (id) {
                await set(ref(database, dbPath), data);
            } else {
                await push(ref(database, dbPath), data);
            }
            form.reset();
            alert("Salvo com sucesso!");
        }

        window.deleteItem = (key) => {
            if(confirm("Deseja excluir?")) remove(ref(database, `${sections[currentSection].dbRef}/${key}`));
        };

        // Adiciona o evento de submit em todos os formulários
        Object.keys(sections).forEach(key => {
            document.getElementById(sections[key].formId).addEventListener('submit', handleFormSubmit);
            // Configura os NAMES dos inputs automaticamente para o Firebase
            const form = document.getElementById(sections[key].formId);
            Array.from(form.elements).forEach(el => {
                if(el.id) el.name = el.id.replace(`${key}-`, '').replace('-input', '');
            });
        });

        // Funções de Backup
        window.backupData = async () => {
            const snap = await get(ref(database));
            const blob = new Blob([JSON.stringify(snap.val(), null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `backup_kendence_${new Date().toLocaleDateString()}.json`;
            a.click();
        };

        window.triggerRestore = () => document.getElementById('restore-file-input').click();
        window.restoreData = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const data = JSON.parse(ev.target.result);
                await set(ref(database), data);
                alert("Dados restaurados!");
            };
            reader.readAsText(file);
        };
    </script>
</body>
</html>
