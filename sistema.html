<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Equipe - Kendence F.C.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --kendence-red: #D31F37;
            --kendence-blue: #1F3A79;
            --kendence-dark-blue: #162B58;
            --light-bg: #f0f2f5;
            --white: #ffffff;
            --text-main: #1f2937;
            --border-color: #e5e7eb;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background-color: var(--light-bg); color: var(--text-main); }

        /* --- TELA DE LOGIN --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--kendence-dark-blue); display: flex; 
            align-items: center; justify-content: center; z-index: 10000;
        }
        .login-box {
            background: white; padding: 40px; border-radius: 15px;
            width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .login-box button { width: 100%; padding: 15px; background: var(--kendence-red); color: white; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; }

        /* --- ESTRUTURA DO SISTEMA --- */
        #main-system-content { display: none; }
        header { background: var(--kendence-dark-blue); color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        nav { display: flex; justify-content: center; background: var(--kendence-red); flex-wrap: wrap; }
        nav button { background: none; border: none; color: white; padding: 1rem 1.5rem; cursor: pointer; font-weight: 700; text-transform: uppercase; border-bottom: 4px solid transparent; }
        nav button.active { border-bottom-color: white; }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .tab-content { display: none; background: white; padding: 2rem; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }

        /* FORMULÁRIOS */
        .section-title { color: var(--kendence-dark-blue); border-bottom: 2px solid var(--kendence-red); margin: 2rem 0 1rem; font-weight: 800; text-transform: uppercase; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .full-width { grid-column: 1 / -1; }
        label { font-weight: 700; font-size: 0.8rem; display: block; margin-bottom: 3px; }
        input, select, textarea { width: 100%; padding: 0.7rem; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; }
        
        .btn-submit { background: var(--kendence-dark-blue); color: white; border: none; padding: 1rem; width: 100%; border-radius: 5px; font-weight: 800; cursor: pointer; margin-top: 1rem; }
        .btn-delete { background: var(--kendence-red); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; font-weight: 800; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-box">
            <img src="https://i.postimg.cc/YCqbzcpH/brasao-1.png" height="80">
            <h2>ACESSO RESTRITO</h2>
            <input type="email" id="login-email" placeholder="E-mail">
            <input type="password" id="login-senha" placeholder="Senha">
            <button onclick="window.fazerLogin()">ENTRAR</button>
            <p id="error-msg" style="color:red; display:none; margin-top:10px;">Credenciais inválidas.</p>
        </div>
    </div>

    <div id="main-system-content">
        <header>
            <h1>Kendence F.C.</h1>
            <button onclick="window.logout()" style="color:white; background:none; border:1px solid white; cursor:pointer; padding:5px 10px; border-radius:4px;">Sair</button>
        </header>

        <nav>
            <button class="tab-btn active" onclick="openTab('jogadores')">Elenco</button>
            <button class="tab-btn" onclick="openTab('comissao')">Comissão</button>
            <button class="tab-btn" onclick="openTab('patrocinadores')">Patrocinadores</button>
            <button class="tab-btn" onclick="openTab('agenda')">Agenda</button>
        </nav>

        <div class="container">
            <div id="jogadores" class="tab-content active">
                <form id="formJogador">
                    <input type="hidden" id="jog-id">
                    <div class="section-title">Identificação Básica</div>
                    <div class="form-grid">
                        <div class="full-width"><label>Nome Completo</label><input type="text" id="jog-nome" required></div>
                        <div><label>Apelido</label><input type="text" id="jog-apelido"></div>
                        <div><label>Nascimento</label><input type="date" id="jog-nascimento"></div>
                        <div><label>CPF</label><input type="text" id="jog-cpf"></div>
                        <div><label>WhatsApp</label><input type="text" id="jog-whatsapp"></div>
                        <div><label>Nº Camisa</label><input type="number" id="jog-camisa"></div>
                        <div><label>Status</label><select id="jog-status"><option>Ativo</option><option>Inativo</option></select></div>
                    </div>
                    <div class="section-title">Dados Técnicos</div>
                    <div class="form-grid">
                        <div><label>Posição</label><input type="text" id="jog-pos1"></div>
                        <div><label>Pé Dominante</label><select id="jog-pe"><option>Direito</option><option>Esquerdo</option><option>Ambidestro</option></select></div>
                        <div class="full-width"><label>Histórico de Lesões</label><textarea id="jog-lesoes"></textarea></div>
                    </div>
                    <button type="submit" class="btn-submit">Salvar Jogador</button>
                </form>
                <table id="tabelaJogadores">
                    <thead><tr><th>Atleta</th><th>Posição</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="listaJogadores"></tbody>
                </table>
            </div>

            <div id="comissao" class="tab-content">
                <form id="formComissao">
                    <input type="hidden" id="com-id">
                    <div class="section-title">Dados do Profissional</div>
                    <div class="form-grid">
                        <div class="full-width"><label>Nome Completo</label><input type="text" id="com-nome" required></div>
                        <div><label>Cargo</label><input type="text" id="com-cargo" required></div>
                        <div><label>WhatsApp</label><input type="text" id="com-whatsapp"></div>
                        <div><label>Status</label><select id="com-status"><option>Ativo</option><option>Inativo</option></select></div>
                    </div>
                    <button type="submit" class="btn-submit">Salvar Membro</button>
                </form>
                <table id="tabelaComissao">
                    <thead><tr><th>Membro</th><th>Cargo</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="listaComissao"></tbody>
                </table>
            </div>

            <div id="patrocinadores" class="tab-content">
                <form id="formPatrocinador">
                    <input type="hidden" id="pat-id">
                    <div class="section-title">Dados da Empresa</div>
                    <div class="form-grid">
                        <div class="full-width"><label>Nome Fantasia</label><input type="text" id="pat-nome" required></div>
                        <div><label>Cota</label><select id="pat-cota"><option>Master</option><option>Ouro</option><option>Prata</option><option>Apoio</option></select></div>
                        <div><label>Vencimento</label><input type="text" id="pat-vencimento"></div>
                        <div><label>Status</label><select id="pat-status"><option>Ativo</option><option>Pendente</option></select></div>
                    </div>
                    <button type="submit" class="btn-submit">Salvar Patrocinador</button>
                </form>
                <table id="tabelaPatrocinadores">
                    <thead><tr><th>Empresa</th><th>Cota</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="listaPatrocinadores"></tbody>
                </table>
            </div>

            <div id="agenda" class="tab-content">
                <form id="formAgenda">
                    <input type="hidden" id="age-id">
                    <div class="section-title">Dados da Partida</div>
                    <div class="form-grid">
                        <div><label>Data</label><input type="date" id="age-data" required></div>
                        <div><label>Adversário</label><input type="text" id="age-adversario" required></div>
                        <div><label>Placar Final</label><input type="text" id="age-resultado" placeholder="0 x 0"></div>
                    </div>
                    <button type="submit" class="btn-submit">Salvar Jogo</button>
                </form>
                <table id="tabelaAgenda">
                    <thead><tr><th>Data</th><th>Adversário</th><th>Placar</th><th>Ações</th></tr></thead>
                    <tbody id="listaAgenda"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCb7BfxkjQy5-5FZ_FWO5e9HiUFnSiDSK8",
            authDomain: "novokendence.firebaseapp.com",
            databaseURL: "https://novokendence-default-rtdb.firebaseio.com",
            projectId: "novokendence",
            storageBucket: "novokendence.firebasestorage.app",
            messagingSenderId: "371427375184",
            appId: "1:371427375184:web:78107a11c5fc511962b955"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- AUTH ---
        window.fazerLogin = () => {
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-senha').value;
            signInWithEmailAndPassword(auth, email, senha).catch(() => {
                document.getElementById('error-msg').style.display = 'block';
            });
        };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-system-content').style.display = 'block';
                iniciarSincronizacao();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-system-content').style.display = 'none';
            }
        });

        // --- NAVEGAÇÃO ---
        window.openTab = (id) => {
            document.querySelectorAll('.tab-content, .tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        // --- SINCRONIZAÇÃO EM TEMPO REAL ---
        function iniciarSincronizacao() {
            onValue(ref(db, 'jogadores'), (s) => render('listaJogadores', s.val(), 'jog'));
            onValue(ref(db, 'comissao'), (s) => render('listaComissao', s.val(), 'com'));
            onValue(ref(db, 'patrocinadores'), (s) => render('listaPatrocinadores', s.val(), 'pat'));
            onValue(ref(db, 'agenda'), (s) => render('listaAgenda', s.val(), 'age'));
        }

        function render(tbodyId, dados, prefix) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '';
            if(!dados) return;
            Object.entries(dados).forEach(([id, obj]) => {
                let row = `<tr>
                    <td><b>${obj.nome || obj.adversario || obj.data}</b></td>
                    <td>${obj.pos1 || obj.cargo || obj.cota || obj.adversario}</td>
                    <td>${obj.status || obj.resultado || '-'}</td>
                    <td><button class="btn-delete" onclick="window.excluir('${tbodyId.replace('lista', '').toLowerCase()}', '${id}')">Excluir</button></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // --- SALVAMENTO ---
        const setupForm = (formId, path, fields, idField) => {
            document.getElementById(formId).addEventListener('submit', (e) => {
                e.preventDefault();
                let obj = {};
                fields.forEach(f => obj[f.replace(idField + '-', '')] = document.getElementById(f).value);
                const id = document.getElementById(idField + '-id').value;
                id ? set(ref(db, `${path}/${id}`), obj) : push(ref(db, path), obj);
                e.target.reset();
            });
        };

        setupForm('formJogador', 'jogadores', ['jog-nome', 'jog-apelido', 'jog-nascimento', 'jog-cpf', 'jog-whatsapp', 'jog-camisa', 'jog-status', 'jog-pos1', 'jog-pe', 'jog-lesoes'], 'jog');
        setupForm('formComissao', 'comissao', ['com-nome', 'com-cargo', 'com-whatsapp', 'com-status'], 'com');
        setupForm('formPatrocinador', 'patrocinadores', ['pat-nome', 'pat-cota', 'pat-vencimento', 'pat-status'], 'pat');
        setupForm('formAgenda', 'agenda', ['age-data', 'age-adversario', 'age-resultado'], 'age');

        window.excluir = (path, id) => confirm("Excluir registro?") && remove(ref(db, `${path}/${id}`));
    </script>
</body>
</html>
